name: CI and production promotion

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint API
        run: python -m ruff check .

      - name: Test API
        run: python -m pytest

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Type-check web
        run: npm run typecheck

      - name: Build web
        run: npm run build

  promote-production:
    name: Promote tested commit to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - api
      - web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fast-forward production branch
        run: git push origin HEAD:production
