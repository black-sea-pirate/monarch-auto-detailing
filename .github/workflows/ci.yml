name: CI and production promotion

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment script
        run: bash -n infra/deploy/monarch-deploy.sh

      - name: Validate Nginx configuration
        run: >-
          docker run --rm
          --add-host web:127.0.0.1
          --add-host api:127.0.0.1
          -v "$PWD/infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.29-alpine nginx -t

  api:
    name: API checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://monarch:ci-only-password@127.0.0.1:5432/monarch
      RUN_DB_TESTS: "1"
      APP_ENV: development
      ADMIN_DEV_TOKEN: ci-admin-token
      ADMIN_ALLOWED_EMAILS: '["owner@example.com"]'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: monarch
          POSTGRES_USER: monarch
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monarch -d monarch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint API
        run: python -m ruff check .

      - name: Apply database migrations
        run: python -m app.migrate

      - name: Test API
        run: python -m pytest

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Type-check web
        run: npm run typecheck

      - name: Build web
        run: npm run build

  promote-production:
    name: Promote tested commit to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - infra
      - api
      - web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fast-forward production branch
        run: git push origin HEAD:production
