map $http_cf_connecting_ip $monarch_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $monarch_client_ip zone=quote_create:10m rate=6r/m;

upstream monarch_web {
    server web:3000;
    keepalive 16;
}

upstream monarch_api {
    server api:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name admin.monarch-yyc.com;

    if ($http_x_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
    }

    client_max_body_size 1m;

    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        return 302 /admin;
    }

    location /api/v1/admin/ {
        proxy_pass http://monarch_api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $monarch_client_ip;
        proxy_set_header X-Forwarded-For $monarch_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        return 404;
    }

    location / {
        proxy_pass http://monarch_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $monarch_client_ip;
        proxy_set_header X-Forwarded-For $monarch_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80 default_server;
    server_name monarch-yyc.com www.monarch-yyc.com _;

    if ($http_x_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
    }

    client_max_body_size 52m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /admin {
        return 404;
    }

    location ^~ /api/v1/admin/ {
        return 404;
    }

    location = /api/v1/quote-requests {
        limit_req zone=quote_create burst=4 nodelay;
        proxy_pass http://monarch_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $monarch_client_ip;
        proxy_set_header X-Forwarded-For $monarch_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://monarch_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $monarch_client_ip;
        proxy_set_header X-Forwarded-For $monarch_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://monarch_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $monarch_client_ip;
        proxy_set_header X-Forwarded-For $monarch_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
